# ── required ──────────────────────────────────────────────────────────────────
agent_name: Agentic_memory_letta
model: gpt-4o-mini
text_embedding: text-embedding-3-small
system_path: ./methods/letta/prompts/system.txt
temperature: 0.7
input_length_limit: 10000000
buffer_length: 5000
output_dir: ./results/outputs/api/hybrid_letta
agent_chunk_size: 2048
letta_mode: insert          # insert | chat
letta_retrieval_page_size: 3  # was 10 in vendored Letta; lower top-k keeps archival search tool outputs inside 32k

# ── optional (LLM) ────────────────────────────────────────────────────────────
provider: openai_compatible
api_key_env: OPENAI_API_KEY
base_url:
base_url_env: OPENAI_BASE_URL
context_window: 32768
tokenizer_encoding: o200k_base

# ── optional (embedding) ──────────────────────────────────────────────────────
# IMPORTANT: embedding is called by the local Letta server directly.
# Default endpoint is https://api.openai.com/v1 — requires a real OPENAI_API_KEY.
# If you set api_key_env to a non-OpenAI key (e.g. DEEPSEEK_API_KEY), you MUST also set
# embedding_base_url to an endpoint that accepts that key, or set embedding_api_key_env
# to a separate env var holding a real OpenAI key.
embedding_api_key_env: OPENAI_API_KEY
embedding_base_url:
embedding_base_url_env: OPENAI_BASE_URL
embedding_dim: 1536
model_env: OPENAI_MODEL
model_api_trust_env: true
model_api_trust_env_env: OPENAI_API_TRUST_ENV
api_only: true
agent_variant_tag: api-models-v1
embedding_model: text-embedding-3-small
embedding_model_env: OPENAI_EMBEDDING_MODEL
embedding_dim_env: OPENAI_EMBEDDING_DIMENSIONS
embedding_provider: openai_compatible
