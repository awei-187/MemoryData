# ── required ──────────────────────────────────────────────────────────────────
agent_name: Structure_rag_graph_rag
model: gpt-4o-mini
temperature: 0.7
input_length_limit: 250000
buffer_length: 500
output_dir: ./results/outputs/api/topological_graph_rag
retrieve_num: 10
graph_rag_internal_max_tokens: 1024    # was 256 in local fix; only used for internal structured steps

# ── optional (LLM) ────────────────────────────────────────────────────────────
provider: openai_compatible
api_key_env: OPENAI_API_KEY
base_url:
base_url_env: OPENAI_BASE_URL
azure_endpoint:
azure_api_version:
tokenizer_encoding: o200k_base

# ── optional (embedding) ──────────────────────────────────────────────────────
# REQUIRED when using a non-OpenAI chat backend (provider: openai_compatible / azure_openai).
embedding_model: text-embedding-3-small
embedding_provider: openai_compatible
embedding_api_key_env: OPENAI_API_KEY
embedding_base_url:
embedding_base_url_env: OPENAI_BASE_URL
embedding_azure_endpoint:
embedding_azure_api_version:
model_env: OPENAI_MODEL
model_api_trust_env: true
model_api_trust_env_env: OPENAI_API_TRUST_ENV
api_only: true
agent_variant_tag: api-models-v1
embedding_model_env: OPENAI_EMBEDDING_MODEL
embedding_dim: 1536
embedding_dim_env: OPENAI_EMBEDDING_DIMENSIONS
