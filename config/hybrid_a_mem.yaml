# -- required ---------------------------------------------------------------
agent_name: Agentic_memory_a_mem
model: gpt-4o-mini
temperature: 0.0
input_length_limit: 10000000
buffer_length: 1000
output_dir: ./results/outputs/api/hybrid_a_mem
agent_chunk_size: 4096
retrieve_num: 2

# -- optional (tokenizer / provider metadata) ------------------------------
provider: openai_compatible
tokenizer_encoding: o200k_base

# -- optional (A-MEM runtime) ----------------------------------------------
a_mem_backend: openai          # openai | sglang
a_mem_api_key_env: OPENAI_API_KEY
a_mem_base_url:
a_mem_embedding_provider: openai_compatible
a_mem_embedding_api_key_env: OPENAI_API_KEY
a_mem_embedding_base_url:
a_mem_embedding_model: text-embedding-3-small
a_mem_sglang_host: http://localhost
a_mem_sglang_port: 30000
model_env: OPENAI_MODEL
api_key_env: OPENAI_API_KEY
base_url:
base_url_env: OPENAI_BASE_URL
model_api_trust_env: true
model_api_trust_env_env: OPENAI_API_TRUST_ENV
api_only: true
agent_variant_tag: api-models-v1
embedding_model: text-embedding-3-small
embedding_model_env: OPENAI_EMBEDDING_MODEL
embedding_dim: 1536
embedding_dim_env: OPENAI_EMBEDDING_DIMENSIONS
embedding_provider: openai_compatible
embedding_api_key_env: OPENAI_API_KEY
embedding_base_url:
embedding_base_url_env: OPENAI_BASE_URL
a_mem_embedding_base_url_env: OPENAI_BASE_URL
