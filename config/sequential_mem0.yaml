# -- required ---------------------------------------------------------------
agent_name: Structure_rag_mem0
model: gpt-4o-mini
mem0_embedder_model: text-embedding-3-small
temperature: 0.7
input_length_limit: 10000000
buffer_length: 1000
output_dir: ./results/outputs/api/sequential_mem0
agent_chunk_size: 4096    # deprecated for Mem0 runtime behavior; kept for benchmark harness path/tag compatibility
retrieve_num: 100

# -- optional (LLM) ---------------------------------------------------------
provider: openai_compatible
api_key_env: OPENAI_API_KEY
base_url:
base_url_env: OPENAI_BASE_URL
azure_endpoint:
azure_api_version:
tokenizer_encoding: o200k_base

# -- optional (embedding endpoint) -----------------------------------------
embedding_api_key_env: OPENAI_API_KEY
embedding_base_url:
embedding_base_url_env: OPENAI_BASE_URL

# -- optional (prompt overrides) -------------------------------------------
mem0_fact_extraction_prompt:   # override the benchmark-selected fact extraction template
mem0_memory_answer_prompt:     # override the benchmark-selected answer template
model_env: OPENAI_MODEL
model_api_trust_env: true
model_api_trust_env_env: OPENAI_API_TRUST_ENV
api_only: true
agent_variant_tag: api-models-v1
embedding_model: text-embedding-3-small
embedding_model_env: OPENAI_EMBEDDING_MODEL
embedding_dim: 1536
embedding_dim_env: OPENAI_EMBEDDING_DIMENSIONS
embedding_provider: openai_compatible
