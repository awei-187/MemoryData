# ── required ──────────────────────────────────────────────────────────────────
agent_name: Agentic_memory_memochat
model: gpt-4o-mini
temperature: 0.7
input_length_limit: 1280000
model_context_window: 32768
buffer_length: 2000
output_dir: ./results/outputs/api/sequential_memochat
agent_chunk_size: 4096
retrieve_num: 10

# ── optional (chat model) ─────────────────────────────────────────────────────
provider: openai_compatible
api_key:
api_key_env: OPENAI_API_KEY
base_url:
base_url_env: OPENAI_BASE_URL
tokenizer_encoding: o200k_base

# ── optional (fallback embedding model) ───────────────────────────────────────
embedding_model: text-embedding-3-small
embedding_provider: openai_compatible
embedding_api_key:
embedding_api_key_env: OPENAI_API_KEY
embedding_base_url:
embedding_base_url_env: OPENAI_BASE_URL
embedding_dim: 1536

# ── optional (memochat adapter tuning) ────────────────────────────────────────
memochat_summary_trigger_chunks: 6
memochat_keep_recent_chunks: 2
memochat_max_topics_per_window: 3
memochat_summary_chars: 320
memochat_keyword_limit: 16
memochat_topic_top_k: 4
memochat_recent_top_k: 2
memochat_dialogs_per_topic: 2
memochat_llm_max_tokens: 384
memochat_use_llm_topic_segmentation: true
model_env: OPENAI_MODEL
model_api_trust_env: true
model_api_trust_env_env: OPENAI_API_TRUST_ENV
api_only: true
agent_variant_tag: api-models-v1
embedding_model_env: OPENAI_EMBEDDING_MODEL
embedding_dim_env: OPENAI_EMBEDDING_DIMENSIONS
