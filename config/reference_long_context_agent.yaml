# ── required ──────────────────────────────────────────────────────────────────
agent_name: Long_context_agent_gpt-4o-mini
model: gpt-4o-mini
temperature: 0.7
input_length_limit: 30000
buffer_length: 4000
output_dir: ./results/outputs/api/reference_long_context_agent

# ── optional ──────────────────────────────────────────────────────────────────
provider: openai_compatible
api_key_env: OPENAI_API_KEY
base_url:
base_url_env: OPENAI_BASE_URL
azure_endpoint:     # Azure OpenAI resource endpoint
azure_api_version:  # Azure OpenAI API version
tokenizer_encoding: o200k_base
tokenizer_model:
model_env: OPENAI_MODEL
model_api_trust_env: true
model_api_trust_env_env: OPENAI_API_TRUST_ENV
api_only: true
agent_variant_tag: api-models-v1
