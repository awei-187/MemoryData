# ── required ──────────────────────────────────────────────────────────────────
agent_name: Structure_rag_zep_local
model: gpt-4o-mini
temperature: 0.7
input_length_limit: 10000000
buffer_length: 5000
output_dir: ./results/outputs/api/topological_zep_local
agent_chunk_size: 4096
retrieve_num: 10

# ── optional (chat backend) ───────────────────────────────────────────────────
provider: openai_compatible
api_key_env: OPENAI_API_KEY
base_url:
base_url_env: OPENAI_BASE_URL
azure_endpoint:
azure_api_version:
tokenizer_encoding: o200k_base

# ── optional (Graphiti extraction / rerank backend) ───────────────────────────
zep_local_small_model: gpt-4o-mini
zep_local_llm_temperature: 0.0    # keep Graphiti extraction deterministic for structured outputs
zep_local_llm_max_tokens: 512    # avoid Graphiti's overly large default on 32k local models
zep_local_episode_max_chars: 3000    # split long non-dialogue chunks into smaller Graphiti episodes

# ── optional (embedding backend for Graphiti) ─────────────────────────────────
text_embedding: text-embedding-3-small
embedding_api_key_env: OPENAI_API_KEY
embedding_base_url:
embedding_base_url_env: OPENAI_BASE_URL
embedding_dim: 1536

# ── optional (local graph store) ──────────────────────────────────────────────
neo4j_uri: bolt://localhost:7687
neo4j_user: neo4j
neo4j_password: neo4jneo4j

# ── optional (answer generation backend) ──────────────────────────────────────
zep_local_answer_model: gpt-4o-mini
zep_local_answer_api_key_env: OPENAI_API_KEY    # was implicit; defaults to api_key_env
zep_local_answer_base_url:
zep_local_answer_temperature: 0.0    # was upstream default
zep_local_answer_max_tokens: 200    # was upstream default
model_env: OPENAI_MODEL
model_api_trust_env: true
model_api_trust_env_env: OPENAI_API_TRUST_ENV
api_only: true
agent_variant_tag: api-models-v1
embedding_model: text-embedding-3-small
embedding_model_env: OPENAI_EMBEDDING_MODEL
embedding_dim_env: OPENAI_EMBEDDING_DIMENSIONS
embedding_provider: openai_compatible
