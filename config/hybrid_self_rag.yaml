# ── required ──────────────────────────────────────────────────────────────────
agent_name: Agentic_memory_self_rag
model: gpt-4o-mini
temperature: 0.7
input_length_limit: 280000
buffer_length: 200
output_dir: ./results/outputs/api/hybrid_self_rag
retrieve_num: 10

# ── optional ──────────────────────────────────────────────────────────────────
provider: openai_compatible
api_key_env: OPENAI_API_KEY
base_url:
base_url_env: OPENAI_BASE_URL
azure_endpoint:
azure_api_version:
tokenizer_encoding: o200k_base

# ── optional (embedding) ──────────────────────────────────────────────────────
# embedding_api_key_env defaults to OPENAI_API_KEY — independent of the LLM key above.
# Set it explicitly if your OpenAI key env var has a different name.
embedding_model: text-embedding-3-small
embedding_provider: openai_compatible
embedding_api_key_env: OPENAI_API_KEY
embedding_base_url:
embedding_base_url_env: OPENAI_BASE_URL
embedding_azure_endpoint:
embedding_azure_api_version:
model_env: OPENAI_MODEL
model_api_trust_env: true
model_api_trust_env_env: OPENAI_API_TRUST_ENV
api_only: true
agent_variant_tag: api-models-v1
embedding_model_env: OPENAI_EMBEDDING_MODEL
embedding_dim: 1536
embedding_dim_env: OPENAI_EMBEDDING_DIMENSIONS
