# ── required ──────────────────────────────────────────────────────────────────
agent_name: Agentic_memory_memoryos
model: gpt-4o-mini
temperature: 0.7
input_length_limit: 1280000
model_context_window: 32768
buffer_length: 2000
output_dir: ./results/outputs/api/hybrid_memoryos
agent_chunk_size: 4096
retrieve_num: 10

# ── optional (chat model) ─────────────────────────────────────────────────────
provider: openai_compatible
api_key:
api_key_env: OPENAI_API_KEY
base_url:
base_url_env: OPENAI_BASE_URL
tokenizer_encoding: o200k_base

# ── optional (embedding model) ────────────────────────────────────────────────
embedding_model: text-embedding-3-small
embedding_provider: openai_compatible
embedding_api_key:
embedding_api_key_env: OPENAI_API_KEY
embedding_base_url:
embedding_base_url_env: OPENAI_BASE_URL

# ── optional (memoryos adapter tuning) ────────────────────────────────────────
memoryos_short_term_capacity: 1
memoryos_mid_term_capacity: 2000
memoryos_queue_capacity: 10
memoryos_topic_similarity_threshold: 0.6
memoryos_heat_threshold: 5.0
memoryos_summary_chars: 384
memoryos_keyword_limit: 16
memoryos_segment_threshold: 0.1
memoryos_page_threshold: 0.1
memoryos_knowledge_threshold: 0.1
memoryos_llm_max_tokens: 512
model_env: OPENAI_MODEL
model_api_trust_env: true
model_api_trust_env_env: OPENAI_API_TRUST_ENV
api_only: true
agent_variant_tag: api-models-v1
embedding_model_env: OPENAI_EMBEDDING_MODEL
embedding_dim: 1536
embedding_dim_env: OPENAI_EMBEDDING_DIMENSIONS
