# -- required ---------------------------------------------------------------
agent_name: memagent_7b
model: gpt-4o-mini
tokenizer_model:
provider: openai_compatible
base_url:
api_key_env: OPENAI_API_KEY
temperature: 0.7
top_p: 0.95
input_length_limit: 120000
buffer_length: 5000
output_dir: ./results/outputs/api/sequential_memagent
recurrent_chunk_size: 5000
recurrent_max_new: 1024
recurrent_max_context_len: 120000

# -- optional ---------------------------------------------------------------
base_url_env: OPENAI_BASE_URL
tokenizer_encoding: o200k_base
api_key:            # explicit API key string; overrides api_key_env in methods/memagent/agent.py
model_env: OPENAI_MODEL
model_api_trust_env: true
model_api_trust_env_env: OPENAI_API_TRUST_ENV
api_only: true
agent_variant_tag: api-models-v1
