agent_name: Structure_rag_hippo_rag_v2_openai
model: gpt-4o-mini
temperature: 0.7
input_length_limit: 10000000
buffer_length: 200
output_dir: ./results/outputs/api/topological_hippo_rag_v2_openai
retrieve_num: 10

# Optional (LLM)
# HippoRAG uses an OpenAI-compatible client for generation when base_url is provided.
provider: openai_compatible
api_key_env: OPENAI_API_KEY
base_url:
base_url_env: OPENAI_BASE_URL
tokenizer_encoding: o200k_base

# Optional (embedding)
# Set embedding_model to select the embedding backend explicitly.
# When embedding_model is set, the agent_name suffix is ignored for backend selection.
# Common choices:
#   text-embedding-ada-002   — OpenAI API (default when this field is left empty)
#   text-embedding-3-small   — OpenAI API
#   nvidia/NV-Embed-v2       — local NVIDIA model (requires GPU + transformers)
embedding_model: text-embedding-3-small
embedding_api_key_env: OPENAI_API_KEY
embedding_base_url:
embedding_base_url_env: OPENAI_BASE_URL
model_env: OPENAI_MODEL
model_api_trust_env: true
model_api_trust_env_env: OPENAI_API_TRUST_ENV
api_only: true
agent_variant_tag: api-models-v1
embedding_model_env: OPENAI_EMBEDDING_MODEL
embedding_dim: 1536
embedding_dim_env: OPENAI_EMBEDDING_DIMENSIONS
embedding_provider: openai_compatible
