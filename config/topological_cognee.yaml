# ── required ──────────────────────────────────────────────────────────────────
agent_name: Structure_rag_cognee
model: gpt-4o-mini
temperature: 0.0
input_length_limit: 1280000
model_context_window: 32768
buffer_length: 2000
output_dir: ./results/outputs/api/topological_cognee
agent_chunk_size: 2048
retrieve_num: 10

# ── optional ──────────────────────────────────────────────────────────────────
provider: openai_compatible
api_key:
api_key_env: OPENAI_API_KEY
base_url:
base_url_env: OPENAI_BASE_URL
tokenizer_encoding: o200k_base

# ── optional (embedding) ──────────────────────────────────────────────────────
# IMPORTANT: when provider is openai_compatible (e.g. deepseek), cognee's embedding
# falls back to the same LLM endpoint and key, which will fail for OpenAI embedding models.
# You MUST set embedding_api_key_env to a real OPENAI_API_KEY, OR set embedding_base_url
# to an endpoint that supports the chosen embedding model.
embedding_model: text-embedding-3-small
embedding_provider: openai_compatible
embedding_api_key:
embedding_api_key_env: OPENAI_API_KEY
embedding_base_url:
embedding_base_url_env: OPENAI_BASE_URL

# ── optional (runtime) ────────────────────────────────────────────────────────
cognee_skip_connection_test: true
model_env: OPENAI_MODEL
model_api_trust_env: true
model_api_trust_env_env: OPENAI_API_TRUST_ENV
api_only: true
agent_variant_tag: api-models-v1
embedding_model_env: OPENAI_EMBEDDING_MODEL
embedding_dim: 1536
embedding_dim_env: OPENAI_EMBEDDING_DIMENSIONS
